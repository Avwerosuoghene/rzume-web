<section class="roles_container">

  <div class="role-limit-bar">
    <p class="role-limit-text">
      <span class="role-limit-label">Role limit:</span> {{ (stats$ | async)?.createdCount ?? 0 }} / {{ roleLimit }} roles created
    </p>
    <button class="add-role-btn" type="button" (click)="openAddRoleDialog()">
      <span class="add-icon">+</span> Add<span class="add-role-btn-full-label"> New Role</span>
    </button>
  </div>

  <div class="active-roles-section">
    <div class="active-roles-header">
      <h3 class="active-roles-title">Active roles</h3>
      <p class="active-roles-subtitle">You are only allowed a maximum of {{ roleLimit }} role{{ roleLimit === 1 ? '' : 's' }} at this stage.</p>
    </div>

    <!-- Mobile search lives in the shared header (see the global-search vault plan); desktop gets
         its own toolbar here, mirroring Dashboard's job-list-toolbar. Both write into the same
         SearchStateService.searchTerm$, so filteredRoles$ reacts to either. -->
    <div class="roles-toolbar desktop_only">
      <app-custom-search-input (searchChange)="onSearchChange($event)"></app-custom-search-input>
    </div>

    <app-role-card-skeleton *ngIf="loading$ | async; else rolesContent" data-cy="roles-loading"></app-role-card-skeleton>

    <ng-template #rolesContent>
      <ng-container *ngIf="(filteredRoles$ | async) as filteredRoles">
        <app-empty-state-wrapper
          [data]="filteredRoles"
          [hasActiveFilter]="(hasActiveFilter$ | async) ?? false"
          [emptyState]="emptyState"
          [noResultsState]="noSearchResultsState"
          class="roles-empty-state"
        >
          <div class="roles-list">
            <app-role-card
              *ngFor="let role of filteredRoles"
              [role]="role"
              (editRole)="onEditRole($event)"
              (delete)="onDeleteRole($event)"
              (deleteDocument)="onDeleteRoleDocument($event)"
            ></app-role-card>
          </div>
        </app-empty-state-wrapper>
      </ng-container>
    </ng-template>
  </div>

</section>
