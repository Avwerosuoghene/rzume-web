<div class="role-card">
  <div class="role-card-header">
    <div class="role-card-heading" *ngIf="isExpanded; else collapsedHeading">
      <p class="role-card-title">{{ role.title }}</p>
      <p class="role-card-industry">{{ role.industryName }}</p>
    </div>
    <ng-template #collapsedHeading>
      <div class="role-card-heading role-card-heading--collapsed">
        <p class="role-card-title">{{ role.title }}</p>
        <p class="role-card-industry-count">
          <span class="role-card-industry">{{ role.industryName }}</span>
          <span class="role-card-separator">&bull;</span>
          <span class="role-card-document-count">{{ documentCountLabel }}</span>
        </p>
      </div>
    </ng-template>

    <div class="role-card-header-actions">
      <button
        mat-icon-button
        class="role-card-toggle"
        (click)="toggleExpanded()"
        [attr.aria-label]="isExpanded ? 'Collapse role' : 'Expand role'"
        [attr.aria-expanded]="isExpanded">
        <mat-icon class="role-card-toggle-icon" [class.role-card-toggle-icon--expanded]="isExpanded">expand_more</mat-icon>
      </button>

      <button mat-icon-button [matMenuTriggerFor]="roleMenu" aria-label="Role actions">
        <mat-icon>more_vert</mat-icon>
      </button>
      <mat-menu #roleMenu="matMenu">
        <button mat-menu-item (click)="onEditRole()">
          <mat-icon>edit</mat-icon>
          <span>Edit Role</span>
        </button>
        <button mat-menu-item (click)="onDelete()">
          <mat-icon>delete</mat-icon>
          <span>Remove Role</span>
        </button>
      </mat-menu>
    </div>
  </div>

  <div class="role-card-documents" *ngIf="isExpanded" @expandCollapse>
    <app-document-item
      *ngFor="let document of role.documents"
      [document]="toDocumentItem(document)"
      actionsVariant="menu"
      [excludeActions]="excludedDocumentActions"
      [filenameTruncateLimit]="documentFilenameTruncateLimit"
      (delete)="onDeleteDocument($event)">
    </app-document-item>
  </div>
</div>
