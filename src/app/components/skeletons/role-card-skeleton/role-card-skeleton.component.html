<!-- Role Card Skeleton Only -->
<div class="role-skeleton-list">
  @for (item of placeholders; track $index) {
    <article class="role-skeleton-card">
      <header class="role-skeleton-header">
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-industry"></div>
      </header>
      <div class="role-skeleton-document">
        <div class="skeleton skeleton-doc-icon"></div>
        <div class="role-skeleton-document-text">
          <div class="skeleton skeleton-doc-name"></div>
          <div class="skeleton skeleton-doc-meta"></div>
        </div>
      </div>
    </article>
  }
</div>
